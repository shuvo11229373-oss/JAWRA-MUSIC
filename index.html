<style>
*{
    box-sizing:border-box;
    margin:0;

html{

button,input{

button{

/* ================= SPLASH ================= */

#splashScreen{
    position:fixed;
    inset:0;
    background:#080808;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:99999;
    transition:.6s;
}

.splash-content{
    text-align:center;
    animation:zoomIn .8s ease;
}

.splash-logo{
    width:200px;
    height:200px;
    border-radius:50%;
    object-fit:cover;
    margin-bottom:25px;
    box-shadow:
        0 0 35px rgba(160,32,240,.6),
        0 0 80px rgba(160,32,240,.2);
    animation:pulse 2s infinite;
}

.splash-loader{
    width:38px;
    height:38px;
    margin:auto;
    border:3px solid rgba(160,32,240,.2);
    border-top-color:#b026ff;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes zoomIn{
    from{
        transform:scale(.7);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

@keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.04)}
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

/* ================= HEADER ================= */

.header{
    height:68px;

    align-items:center;
    justify-content:space-between;
    padding:0 17px;

    border-bottom:1px solid #eee;

}

.logo{

    font-weight:900;

}

.header-icons{
    display:flex;
    gap:17px;

}

.header-search,
.menu-button{

    background:none;
    font-size:28px;
}

/* ================= SEARCH ================= */

.search-area{

}

.search{

    background:#fafafa;
    box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.search input{

    border:0;

.search button{

    background:#f1f1f1;

/* ================= CATEGORIES ================= */

.categories{

}

}

/* ================= RESULTS ================= */

}

.thumbnail-wrap{

.thumbnail{

<script>

/* =================================================
   API KEY
   ================================================= */

const API_KEY =
    "AIzaSyByuQ_hrEaCvAUoqdIkGyzMDWMTlzZ0zGo";


/* =================================================
   QUOTA / CACHE SETTINGS
   ================================================= */

const CACHE_TIME =
    1000 * 60 * 30; // 30 মিনিট

const REQUEST_GAP =
    1800; // request-এর মধ্যে 1.8 sec

const MAX_HOME_PAGES =
    4;

const MAX_SEARCH_PAGES =
    5;

const MAX_RELATED_PAGES =
    2;

let lastRequestTime=0;

let homePageCount=0;
let searchPageCount=0;
let relatedPageCount=0;


/* =================================================
   STATE
   ================================================= */

let currentVideoId="";
let currentTitle="";
let currentChannel="";
let currentThumb="";

let currentMode="home";
let currentSearchQuery="";

let nextPageToken="";
let relatedPageToken="";

let loadingMore=false;
let loadingRelated=false;

let playerHistory=false;

let relatedCacheKey="";


/* =================================================
   SPLASH
   ================================================= */

window.addEventListener("load",()=>{

    setTimeout(()=>{

        const splash=
            document.getElementById(
                "splashScreen"
            );

        splash.style.opacity="0";
        splash.style.visibility="hidden";

    },2500);

});


/* =================================================
   REQUEST DELAY
   ================================================= */

async function waitForRequest(){

    const now=Date.now();

    const wait=
        REQUEST_GAP -
        (now-lastRequestTime);

    if(wait>0){

        await new Promise(
            resolve=>
                setTimeout(
                    resolve,
                    wait
                )
        );

    }

    lastRequestTime=Date.now();

}


/* =================================================
   CACHE
   ================================================= */

function getCache(key){

    try{

        const raw=
            localStorage.getItem(
                "jawra_cache_"+key
            );

        if(!raw){
            return null;
        }

        const data=
            JSON.parse(raw);

        if(
            Date.now()-
            data.time
            >
            CACHE_TIME
        ){

            localStorage.removeItem(
                "jawra_cache_"+key
            );

            return null;

        }

        return data.value;

    }catch(error){

        return null;

    }

}


function setCache(key,value){

    try{

        localStorage.setItem(
            "jawra_cache_"+key,
            JSON.stringify({
                time:Date.now(),
                value:value
            })
        );

    }catch(error){}

}


/* =================================================
   SAFE API FETCH
   ================================================= */

async function youtubeRequest(
    query,
    pageToken=""
){

    const params=
        new URLSearchParams({

            part:"snippet",
            q:query,
            type:"video",
            maxResults:"20",
            regionCode:"BD",
            relevanceLanguage:"bn",
            videoEmbeddable:"true",
            key:API_KEY

        });

    if(pageToken){

        params.set(
            "pageToken",
            pageToken
        );

    }

    const cacheKey=
        query+
        "|" +
        pageToken;

    const cached=
        getCache(cacheKey);

    if(cached){

        return {
            data:cached,
            cached:true
        };

    }

    await waitForRequest();

    const response=
        await fetch(
            "https://www.googleapis.com/youtube/v3/search?"+
            params.toString()
        );

    const data=
        await response.json();

    if(!response.ok){

        throw new Error(
            data.error?.message ||
            "YouTube API Error"
        );

    }

    setCache(
        cacheKey,
        data
    );

    return {
        data:data,
        cached:false
    };

}


/* =================================================
   SEARCH
   ================================================= */

function focusSearch(){

    const input=
        document.getElementById(
            "searchInput"
        );

    input.focus();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


function searchEnter(event){

    if(event.key==="Enter"){

        event.preventDefault();

        searchMusic();

    }

}


/* =================================================
   HOME
   ================================================= */

async function loadHomeVideos(){

    currentMode="home";
    currentSearchQuery="";
    nextPageToken="";
    homePageCount=0;
    loadingMore=false;

    const results=
        document.getElementById(
            "results"
        );

    results.innerHTML=`
        <div class="loading">
            <div class="loading-spinner"></div>
            নতুন ভিডিও লোড হচ্ছে...
        </div>
    `;

    /*
       Random query বাদ দেওয়া হয়েছে।
       এতে একই Home বারবার খুললে cache কাজ করবে।
    */

    const query=
        "Bangla music song";

    try{

        const result=
            await youtubeRequest(
                query
            );

        const data=
            result.data;

        nextPageToken=
            data.nextPageToken || "";

        homePageCount=1;

        showResults(
            shuffleArray(
                data.items || []
            )
        );

    }catch(error){

        showApiError(
            results,
            error
        );

    }

}


/* =================================================
   SEARCH
   ================================================= */

async function searchMusic(){

    const input=
        document
        .getElementById(
            "searchInput"
        )
        .value
        .trim();

    if(!input){

        loadHomeVideos();

        return;

    }

    currentMode="search";
    currentSearchQuery=input;
    nextPageToken="";
    searchPageCount=0;
    loadingMore=false;

    const results=
        document.getElementById(
            "results"
        );

    results.innerHTML=`
        <div class="loading">
            <div class="loading-spinner"></div>
            🔍 ভিডিও খোঁজা হচ্ছে...
        </div>
    `;

    try{

        const result=
            await youtubeRequest(
                input
            );

        const data=
            result.data;

        nextPageToken=
            data.nextPageToken || "";

        searchPageCount=1;

        showResults(
            shuffleArray(
                data.items || []
            )
        );

    }catch(error){

        showApiError(
            results,
            error
        );

    }

}


/* =================================================
   API ERROR
   ================================================= */

function showApiError(
    container,
    error
){

    const message=
        error?.message || "";

    if(
        message.toLowerCase()
        .includes("quota")
    ){

        container.innerHTML=`
            <div class="loading">
                ❌ আজকের YouTube Search quota শেষ হয়ে গেছে।
                <br><br>
                কিছুক্ষণ/পরবর্তী quota reset-এর পর আবার চেষ্টা করুন।
            </div>
        `;

    }else{

        container.innerHTML=`
            <div class="loading">
                ❌ ভিডিও লোড করা যাচ্ছে না।
                <br><br>

/* =================================================
   LOAD MORE
   ================================================= */

async function loadMoreVideos(){

    if(
        loadingMore ||
        !nextPageToken
    ){

        return;

    }

    if(
        currentMode==="home" &&
        homePageCount>=MAX_HOME_PAGES
    ){

        return;

    }

    if(
        currentMode==="search" &&
        searchPageCount>=MAX_SEARCH_PAGES
    ){

        return;

    }

    loadingMore=true;

    const results=
        document.getElementById(
            "results"
        );

    const loader=
        document.createElement(
            "div"
        );

    loader.className="loading";
    loader.id="moreLoader";

    loader.innerHTML=`
        <div class="loading-spinner"></div>
        আরও ভিডিও আসছে...
    `;

    results.appendChild(loader);

    try{

        let query=
            currentSearchQuery;

        if(
            currentMode==="home"
        ){

            query=
                "Bangla music song";

        }

        const result=
            await youtubeRequest(
                query,
                nextPageToken
            );

        const data=
            result.data;

        nextPageToken=
            data.nextPageToken || "";

        if(
            currentMode==="home"
        ){

            homePageCount++;

        }else{

            searchPageCount++;

        }

        loader.remove();

        appendResults(
            shuffleArray(
                data.items || []
            )
        );

    }catch(error){

        loader.innerText=
            "আরও ভিডিও এখন লোড করা যাচ্ছে না।";

    }

    loadingMore=false;

}


/* =================================================
   PLAY VIDEO
   ================================================= */

function playVideo(
    videoId,
    title,
    channel,
    thumb
){

    currentVideoId=videoId;
    currentTitle=title;
    currentChannel=channel;
    currentThumb=thumb;

    const overlay=
        document.getElementById(
            "playerOverlay"
        );

    const frame=
        document.getElementById(
            "ytFrame"
        );

    let embed=
        "https://www.youtube-nocookie.com/embed/"+
        encodeURIComponent(videoId)+
        "?autoplay=1"+
        "&playsinline=1"+
        "&rel=0"+
        "&modestbranding=1";

    const origin=
        window.location.origin;

    if(
        origin &&
        origin!=="null" &&
        (
            origin.startsWith("http://") ||
            origin.startsWith("https://")
        )
    ){

        embed+=
            "&enablejsapi=1"+
            "&origin="+
            encodeURIComponent(origin);

    }

    frame.src=embed;

    overlay.classList.add("show");

    document.body.style.overflow="hidden";

    history.pushState(
        {jawraPlayer:true},
        "",
        "#player"
    );

    playerHistory=true;

    relatedPageToken="";
    relatedPageCount=0;
    loadingRelated=false;

    const related=
        document.getElementById(
            "relatedResults"
        );

    related.innerHTML=`
        <div class="related-loading">

            <div class="related-spinner"></div>

            একই ধরনের ভিডিও খোঁজা হচ্ছে...

        </div>
    `;

    loadRelatedVideos(title);

}


/* =================================================
   RELATED QUERY
   ================================================= */

function makeRelatedQuery(title){

    let clean=
        decodeHtml(title)
        .replace(
            /[^\u0980-\u09FFa-zA-Z0-9\s]/g,
            " "
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();

    const words=
        clean
        .split(" ")
        .filter(Boolean);

    return words
        .slice(0,6)
        .join(" ");

}


/* =================================================
   RELATED
   ================================================= */

async function loadRelatedVideos(title){

    loadingRelated=true;

    const query=
        makeRelatedQuery(title);

    relatedCacheKey=
        "related_"+query;

    try{

        const result=
            await youtubeRequest(
                query
            );

        const data=
            result.data;

        relatedPageToken=
            data.nextPageToken || "";

        relatedPageCount=1;

        const related=
            document.getElementById(
                "relatedResults"
            );

        related.innerHTML="";

        const filtered=
            (data.items || [])
            .filter(item=>{

                return (
                    item.id?.videoId &&
                    item.id.videoId
                    !==currentVideoId
                );

            });

        appendRelatedResults(
            filtered
        );

    }catch(error){

        document.getElementById(
            "relatedResults"
        ).innerHTML=`
            <div class="related-loading">
                একই ধরনের ভিডিও পাওয়া যাচ্ছে না।
            </div>
        `;

    }

    loadingRelated=false;

}

/* =================================================
   UTILITIES
   ================================================= */

function shuffleArray(array){

    const arr=[...array];

    for(
        let i=arr.length-1;
        i>0;
        i--
    ){

        const j=
            Math.floor(
                Math.random()*(i+1)
            );

        [
            arr[i],
            arr[j]
        ]=[
            arr[j],
            arr[i]
        ];

    }

    return arr;

}


function escapeHtml(text){

    const div=
        document.createElement(
            "div"
        );

    div.textContent=
        text || "";

    return div.innerHTML;

}


function decodeHtml(text){

    const div=
        document.createElement(
            "div"
        );

    div.innerHTML=
        text || "";

    return div.textContent;

}
